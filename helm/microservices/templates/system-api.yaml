# Day 27 — Helm template for system-api
{{- if .Values.systemApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: system-api
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.systemApi.replicaCount }}
  selector:
    matchLabels:
      app: system-api
  template:
    metadata:
      labels:
        app: system-api
    spec:
      containers:
        - name: system-api
          image: "{{ .Values.global.image.registry }}/system-api:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: KAFKA_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: ZIPKIN_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ZIPKIN_URL
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/startup
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.systemApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: system-api
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: system-api
  ports:
    - port: {{ .Values.systemApi.service.port }}
      targetPort: {{ .Values.systemApi.service.port }}
  type: ClusterIP
{{- if .Values.systemApi.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: system-api-hpa
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: system-api
  minReplicas: {{ .Values.systemApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.systemApi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.systemApi.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
