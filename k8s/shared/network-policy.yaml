# Day 26 — NetworkPolicy: restricts inter-service traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: system-api-netpol
  namespace: microservices-training
spec:
  podSelector:
    matchLabels:
      app: system-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: middleware   # Only middleware can call system-api
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: middleware-netpol
  namespace: microservices-training
spec:
  podSelector:
    matchLabels:
      app: middleware
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bff-gateway  # Only BFF can call middleware
      ports:
        - protocol: TCP
          port: 8082
